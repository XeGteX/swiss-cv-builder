# CI/CD Pipeline for NEXAL2 CV Builder
# 
# Runs on PRs and nightly
# - PR: smoke test (fast subset)
# - Nightly: full matrix (180 combinations)

name: NEXAL2 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '20'
  
jobs:
  # ============================================================================
  # BUILD & LINT
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: TypeScript check
        run: npx tsc --noEmit
        
      - name: Build production
        run: npm run build

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run NEXAL2 layout tests
        run: npm run test -- --run tests/nexal2-layout.test.ts
        
      - name: Run pagination tests
        run: npm run test:pagination

  # ============================================================================
  # VISUAL REGRESSION (PR: smoke, Nightly: full)
  # ============================================================================
  visual-regression:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      # Install poppler for PDF rasterization
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
        
      # PR + push: Run visual smoke test (fast)
      - name: Visual Regression (Smoke)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run test:visual
        
      # Nightly only: Run full visual test
      - name: Visual Regression (Full - Nightly)
        if: github.event_name == 'schedule'
        run: npm run test:visual
        
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/__diff__/

  # ============================================================================
  # MATRIX TEST (PR: smoke, Nightly: full 180 combinations)
  # ============================================================================
  matrix-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
        
      # PR: Smoke test (subset) - 2 presets × 2 regions × 2 fixtures = 8 tests
      - name: Matrix Test (Smoke)
        if: github.event_name == 'pull_request'
        run: npm run test:matrix:smoke
        env:
          MATRIX_SMOKE: 'true'
        
      # Nightly: Full matrix - 6 presets × 6 regions × 5 fixtures = 180 tests
      - name: Matrix Test (Full)
        if: github.event_name == 'schedule'
        run: npm run test:matrix
        
      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-report
          path: tests/__diff__/matrix/matrix-report.json
          
  # ============================================================================
  # NIGHTLY REPORT
  # ============================================================================
  nightly-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: [visual-regression, matrix-test]
    steps:
      - name: Create nightly summary
        run: |
          echo "# Nightly Test Report" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Visual regression and matrix tests completed." >> $GITHUB_STEP_SUMMARY
